<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Administrador</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9;">

    <div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2>Painel do Administrador</h2>
        <p>Visão geral de todas as presenças registradas nos tablets.</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        
        <h3>Registro Geral de Presenças</h3>
        <div id="historico-admin">
            <p>Carregando registros...</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            const containerAdmin = document.getElementById("historico-admin");
            containerAdmin.innerHTML = "";

            let encontrouRegistros = false;

            // Varre a memória do navegador para procurar chaves que comecem com "historico_"
            for (let i = 0; i < localStorage.length; i++) {
                const chave = localStorage.key(i);
                
                if (chave.startsWith("historico_")) {
                    encontrouRegistros = true;
                    const cpfAluno = chave.replace("historico_", "");
                    const listaRegistros = JSON.parse(localStorage.getItem(chave)) || [];

                    const blocoAluno = document.createElement("div");
                    blocoAluno.style.cssText = "border: 1px solid #ccc; padding: 10px; margin-bottom: 15px; border-radius: 6px; background: #fafafa;";
                    
                    let htmlItens = `<h4>Aluno (CPF: ${cpfAluno})</h4>`;
                    
                    listaRegistros.forEach(reg => {
                        htmlItens += `
                            <div style="border-top: 1px dashed #ddd; padding-top: 5px; margin-top: 5px;">
                                <p style="margin: 2px 0;"><strong>Data:</strong> ${reg.data} às ${reg.hora}</p>
                                <img src="${reg.foto}" alt="Foto" style="width: 80px; height: 60px; object-fit: cover; border-radius: 4px; margin-top: 5px;" />
                            </div>
                        `;
                    });

                    blocoAluno.innerHTML = htmlItens;
                    containerAdmin.appendChild(blocoAluno);
                }
            }

            if (!encontrouRegistros) {
                containerAdmin.innerHTML = "<p>Nenhum registro de presença encontrado no sistema.</p>";
            }
        };
    </script>
</body>
</html>
