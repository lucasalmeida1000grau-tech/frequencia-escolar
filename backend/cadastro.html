<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Sistema Escolar</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9;">

    <div style="max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        <h2 style="color: #222; margin-top: 0;">Cadastro de Aluno</h2>
        
        <form onsubmit="realizarCadastro(event)">
            <label style="font-size: 13px; font-weight: bold;">Nome do Aluno:</label><br>
            <input type="text" id="cad-nome" style="width: 100%; padding: 10px; margin: 6px 0 12px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;" required><br>
            
            <label style="font-size: 13px; font-weight: bold;">CPF do Aluno (somente números):</label><br>
            <input type="text" id="cad-cpf" style="width: 100%; padding: 10px; margin: 6px 0 12px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;" required><br>
            
            <label style="font-size: 13px; font-weight: bold;">Código da Sala / Turma (criado pelo Admin):</label><br>
            <input type="text" id="cad-turma" placeholder="Ex: 2A" style="width: 100%; padding: 10px; margin: 6px 0 12px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;" required><br>
            
            <label style="font-size: 13px; font-weight: bold;">E-mail do Responsável:</label><br>
            <input type="email" id="cad-email" style="width: 100%; padding: 10px; margin: 6px 0 12px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;" required><br>

            <label style="font-size: 13px; font-weight: bold;">Senha de Acesso:</label><br>
            <input type="password" id="cad-senha" style="width: 100%; padding: 10px; margin: 6px 0 15px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;" required><br>
            
            <button type="submit" style="width: 100%; background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Cadastrar</button>
        </form>
        <p id="msg-erro" style="color: red; font-size: 13px; text-align: center; margin-top: 10px;"></p>
        <br>
        <a href="index.html" style="font-size: 13px; color: #007BFF; text-decoration: none;">← Voltar para a página inicial</a>
    </div>

    <script>
        function realizarCadastro(event) {
            event.preventDefault();
            const nome = document.getElementById("cad-nome").value;
            const cpf = document.getElementById("cad-cpf").value.trim();
            const turma = document.getElementById("cad-turma").value.trim();
            const email = document.getElementById("cad-email").value;
            const senha = document.getElementById("cad-senha").value;
            const msgErro = document.getElementById("msg-erro");

            // Verifica se o Administrador criou esta sala/código previamente
            let salasPermitidas = JSON.parse(localStorage.getItem("salas_admin")) || [];
            
            // Se o admin nunca criou nenhuma sala, criamos uma padrão ou exigimos que ele crie. Vamos validar:
            if (salasPermitidas.length > 0 && !salasPermitidas.includes(turma)) {
                msgErro.innerText = "Erro: Esta sala/turma não foi cadastrada pelo Administrador!";
                return;
            }

            localStorage.setItem("aluno_nome", nome);
            localStorage.setItem("aluno_cpf", cpf);
            localStorage.setItem("aluno_turma", turma);
            localStorage.setItem("responsavel_email", email);
            localStorage.setItem("responsavel_senha", senha);

            let listaAlunos = JSON.parse(localStorage.getItem("lista_geral_alunos")) || [];
            listaAlunos.push({ nome, cpf, turma, email, senha });
            localStorage.setItem("lista_geral_alunos", JSON.stringify(listaAlunos));

            alert("Cadastro realizado com sucesso!");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
