<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro - Sistema Escolar</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9;">

    <div style="max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2>Cadastro de Aluno e Responsável</h2>
        
        <form onsubmit="realizarCadastro(event)">
            <label>Nome do Aluno:</label><br>
            <input type="text" id="cad-nome" style="width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box;" required><br>
            
            <label>CPF do Aluno (somente números):</label><br>
            <input type="text" id="cad-cpf" style="width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box;" required><br>
            
            <label>Turma:</label><br>
            <input type="text" id="cad-turma" style="width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box;" required><br>
            
            <label>E-mail do Responsável:</label><br>
            <input type="email" id="cad-email" style="width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box;" required><br>
            
            <button type="submit" style="width: 100%; background: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Cadastrar</button>
        </form>
        <br>
        <a href="index.html" style="font-size: 13px; color: #007BFF; text-decoration: none;">← Voltar para a página inicial</a>
    </div>

    <script>
        function realizarCadastro(event) {
            event.preventDefault();
            const nome = document.getElementById("cad-nome").value;
            const cpf = document.getElementById("cad-cpf").value.trim();
            const turma = document.getElementById("cad-turma").value;
            const email = document.getElementById("cad-email").value;

            localStorage.setItem("aluno_nome", nome);
            localStorage.setItem("aluno_cpf", cpf);
            localStorage.setItem("aluno_turma", turma);
            localStorage.setItem("responsavel_email", email);

            alert("Cadastro realizado com sucesso!");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
