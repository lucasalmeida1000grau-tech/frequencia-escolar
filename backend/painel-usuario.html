<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Portal do Aluno / Responsável</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9;">

    <div style="max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2>Portal do Aluno</h2>
        <div id="dados-aluno" style="background: #e9ecef; padding: 15px; border-radius: 5px; margin-bottom: 20px;">
            <p><strong>Nome:</strong> <span id="lbl-nome">-</span></p>
            <p><strong>CPF:</strong> <span id="lbl-cpf">-</span></p>
            <p><strong>Turma:</strong> <span id="lbl-turma">-</span></p>
        </div>

        <h3>Histórico de Presenças</h3>
        <ul id="lista-historico" style="padding-left: 20px; color: #444;">
            <li>Nenhuma presença registrada ainda.</li>
        </ul>

        <br>
        <a href="index.html" style="font-size: 13px; color: #007BFF; text-decoration: none;">← Voltar para a página inicial</a>
    </div>

    <script>
        // Carrega os dados cadastrados
        document.getElementById("lbl-nome").innerText = localStorage.getItem("aluno_nome") || "Não cadastrado";
        document.getElementById("lbl-cpf").innerText = localStorage.getItem("aluno_cpf") || "-";
        document.getElementById("lbl-turma").innerText = localStorage.getItem("aluno_turma") || "-";

        // Carrega o histórico
        const historico = JSON.parse(localStorage.getItem("historico_frequencia")) || [];
        const lista = document.getElementById("lista-historico");

        if (historico.length > 0) {
            lista.innerHTML = "";
            historico.forEach(item => {
                const li = document.createElement("li");
                li.innerText = `Presença registrada em: ${item.data}`;
                lista.appendChild(li);
            });
        }
    </script>
</body>
</html>
