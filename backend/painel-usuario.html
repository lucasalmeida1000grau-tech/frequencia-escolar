<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Responsável - Frequência do Aluno</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9;">

    <div style="max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2>Dados do Aluno Vinculado</h2>
        <p><strong>Nome do Aluno:</strong> Lucas Lima</p>
        <p><strong>CPF do Aluno:</strong> <span id="span-cpf">45870857821</span></p>
        <p><strong>Turma:</strong> 2a</p>
        <p><strong>E-mail do Responsável:</strong> lucasalmeida.lima0899@gmail.com</p>
        
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <h3>Histórico e Status de Frequência</h3>
        <div id="container-historico-usuario">
            <p>Carregando dados de frequência...</p>
        </div>

        <button onclick="sairDaConta()" style="width: 100%; background: #d9534f; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer; margin-top: 20px;">Sair da Conta</button>
    </div>

    <script>
        window.onload = function() {
            // CPF exato do aluno conforme exibido no painel
            const cpfAluno = "45870857821";
            const container = document.getElementById("container-historico-usuario");
            
            // Puxa os registros salvos no localStorage pelo tablet
            const historico = JSON.parse(localStorage.getItem("historico_" + cpfAluno)) || [];
            
            container.innerHTML = "";

            if (historico.length === 0) {
                // Caso não tenha entrado ou esteja ausente/atrasado
                container.innerHTML = `
                    <div style="background: #fff8f8; border: 1px solid #f5c6cb; padding: 12px; border-radius: 6px; color: #721c24;">
                        <p style="margin: 0 0 5px 0;"><strong>Status:</strong> Ausente (Não registrado no tablet hoje)</p>
                        <p style="margin: 0; font-size: 13px;">O aluno ainda não compareceu à aula ou o registro não foi efetuado.</p>
                    </div>
                `;
            } else {
                // Mostra cada registro de entrada encontrado
                historico.forEach(item => {
                    // Exemplo de regra de horário para definir se está atrasado (ex: entrada após as 07:15)
                    let statusTexto = "Presente";
                    let corStatus = "green";
                    
                    if (item.hora > "07:15:00") {
                        statusTexto = "Atrasado";
                        corStatus = "orange";
                    }

                    const bloco = document.createElement("div");
                    bloco.style.cssText = "border: 1px solid #ddd; background: #fafafa; padding: 12px; margin-bottom: 10px; border-radius: 6px;";
                    
                    bloco.innerHTML = `
                        <p style="margin: 0 0 4px 0;"><strong>Data:</strong> ${item.data} às ${item.hora}</p>
                        <p style="margin: 0 0 4px 0; color: ${corStatus};"><strong>Status:</strong> ${statusTexto}</p>
                        <p style="margin: 0 0 4px 0;"><strong>Turma:</strong> 2a</p>
                        <p style="margin: 0 0 4px 0;"><strong>Foto da Entrada:</strong></p>
                        <img src="${item.foto}" alt="Foto do Aluno" style="width: 120px; height: 90px; object-fit: cover; border-radius: 4px; border: 1px solid #ccc;" />
                    `;
                    container.appendChild(bloco);
                });
            }
        };

        function sairDaConta() {
            alert("Você saiu da conta.");
            location.reload();
        }
    </script>
</body>
</html>
