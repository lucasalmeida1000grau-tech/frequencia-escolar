<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel do Administrador</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9;">

    <div style="max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2>Painel Geral - Administrador</h2>
        <p style="color: #666;">Lista completa de presenças registradas no sistema:</p>

        <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
            <thead>
                <tr style="background: #007BFF; color: white; text-align: left;">
                    <th style="padding: 10px; border: 1px solid #ddd;">Nome</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">CPF</th>
                    <th style="padding: 10px; border: 1px solid #ddd;">Data e Hora</th>
                </tr>
            </thead>
            <tbody id="tabela-admin">
                <tr>
                    <td colspan="3" style="padding: 10px; border: 1px solid #ddd; text-align: center;">Nenhum registro encontrado.</td>
                </tr>
            </tbody>
        </table>

        <br>
        <button onclick="limparHistorico()" style="background: #dc3545; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Limpar Registros</button>
        <br><br>
        <a href="index.html" style="font-size: 13px; color: #007BFF; text-decoration: none;">← Sair para a página inicial</a>
    </div>

    <script>
        const historico = JSON.parse(localStorage.getItem("historico_frequencia")) || [];
        const tabela = document.getElementById("tabela-admin");

        if (historico.length > 0) {
            tabela.innerHTML = "";
            historico.forEach(item => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="padding: 10px; border: 1px solid #ddd;">${item.nome}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">${item.cpf}</td>
                    <td style="padding: 10px; border: 1px solid #ddd;">${item.data}</td>
                `;
                tabela.appendChild(tr);
            });
        }

        function limparHistorico() {
            if (confirm("Deseja realmente apagar todos os registros de presença?")) {
                localStorage.removeItem("historico_frequencia");
                location.reload();
            }
        }
    </script>
</body>
</html>
