<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - Administrador</title>
</head>
<body style="font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; margin: 0;">

    <div style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px;">
        <h2>Acesso Restrito - Admin</h2>
        <form onsubmit="validarLoginAdmin(event)">
            <label>Usuário:</label><br>
            <input type="text" id="usuario-adm" style="width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box;" required><br>
            
            <label>Senha:</label><br>
            <input type="password" id="senha-adm" style="width: 100%; padding: 8px; margin: 8px 0; box-sizing: border-box;" required><br>
            
            <button type="submit" style="width: 100%; background: #28a745; color: white; padding: 10px; border: none; border-radius: 4px; cursor: pointer;">Entrar</button>
        </form>
        <br>
        <a href="index.html" style="font-size: 13px; color: #666; text-decoration: none;">← Voltar para a página inicial</a>
    </div>

    <script>
        function validarLoginAdmin(event) {
            event.preventDefault();
            const usuario = document.getElementById("usuario-adm").value;
            const senha = document.getElementById("senha-adm").value;

            if (usuario === "ADM1" && senha === "ADM2") {
                window.location.href = "painel-admin.html";
            } else {
                alert("Usuário ou senha incorretos! Use ADM1 e ADM2.");
            }
        }
    </script>
</body>
</html>
