<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Tablet - Chamada Escolar</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center;">

    <div style="max-width: 400px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
        <h2>Registro de Frequência</h2>
        <p style="color: #666; font-size: 14px;">Digite o CPF e tire a foto para registrar a entrada:</p>
        
        <input type="text" id="tablet-cpf" placeholder="Digite o CPF do aluno" style="width: 100%; padding: 12px; margin: 10px 0; box-sizing: border-box; font-size: 16px; border: 1px solid #ccc; border-radius: 6px;"><br>

        <!-- Área da Câmera -->
        <div style="margin: 15px 0;">
            <video id="video-camera" autoplay playsinline style="width: 100%; max-height: 200px; background: #000; border-radius: 6px; display: none; object-fit: cover;"></video>
            <canvas id="canvas-foto" style="display: none;"></canvas>
            <img id="img-preview" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; display: none; margin: 10px auto; border: 2px solid #28a745;">
        </div>

        <button id="btn-ligar-camera" onclick="ligarCamera()" style="width: 100%; background: #007BFF; color: white; padding: 10px; border: none; border-radius: 6px; font-weight: bold; font-size: 14px; cursor: pointer; margin-bottom: 8px;">📷 Abrir Câmera</button>
        
        <button onclick="registrarPresenca()" style="width: 100%; background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer;">Registrar Presença e Enviar Foto</button>
        
        <p id="tablet-msg" style="margin-top: 15px; font-weight: bold;"></p>
        
        <br>
        <a href="index.html" style="font-size: 13px; color: #007BFF; text-decoration: none;">← Voltar para a página inicial</a>
    </div>

    <script>
        let streamCamera = null;
        let fotoCapturadaBase64 = "";

        async function ligarCamera() {
            const video = document.getElementById("video-camera");
            try {
                streamCamera = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                video.srcObject = streamCamera;
                video.style.display = "block";
                document.getElementById("btn-ligar-camera").style.display = "none";
            } catch (error) {
                alert("Erro ao acessar a câmera. Verifique as permissões do navegador.");
            }
        }

        function registrarPresenca() {
            const cpfDigitado = document.getElementById("tablet-cpf").value.trim();
            const msg = document.getElementById("tablet-msg");
            const video = document.getElementById("video-camera");
            const canvas = document.getElementById("canvas-foto");

            if (!cpfDigitado) {
                msg.style.color = "red";
                msg.innerText = "Por favor, digite o CPF.";
                return;
            }

            // Captura a foto atual da câmera se estiver ligada
            if (streamCamera) {
                canvas.width = video.videoWidth || 300;
                canvas.height = video.videoHeight || 300;
                const context = canvas.getContext("2d");
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                fotoCapturadaBase64 = canvas.toDataURL("image/png");
            }

            // Busca na lista geral de alunos cadastrados
            let listaAlunos = JSON.parse(localStorage.getItem("lista_geral_alunos")) || [];
            let alunoEncontrado = listaAlunos.find(a => a.cpf === cpfDigitado);

            // Compatibilidade com cadastro único anterior
            if (!alunoEncontrado && cpfDigitado === localStorage.getItem("aluno_cpf")) {
                alunoEncontrado = {
                    nome: localStorage.getItem("aluno_nome"),
                    cpf: cpfDigitado,
                    turma: localStorage.getItem("aluno_turma")
                };
            }

            if (alunoEncontrado) {
                const agora = new Date();
                const dataHora = agora.toLocaleDateString("pt-BR") + " às " + agora.toLocaleTimeString("pt-BR");
                
                let historico = JSON.parse(localStorage.getItem("historico_frequencia")) || [];
                historico.push({ 
                    nome: alunoEncontrado.nome, 
                    cpf: alunoEncontrado.cpf, 
                    turma: alunoEncontrado.turma,
                    data: dataHora,
                    foto: fotoCapturadaBase64 || alunoEncontrado.foto || "" 
                });
                localStorage.setItem("historico_frequencia", JSON.stringify(historico));

                msg.style.color = "green";
                msg.innerText = `Presença registrada com foto para ${alunoEncontrado.nome}!`;
                
                // Limpa os campos
                document.getElementById("tablet-cpf").value = "";
                fotoCapturadaBase64 = "";
                if (streamCamera) {
                    streamCamera.getTracks().forEach(track => track.stop());
                    video.style.display = "none";
                    document.getElementById("btn-ligar-camera").style.display = "block";
                }
            } else {
                msg.style.color = "red";
                msg.innerText = "CPF não encontrado no sistema.";
            }
        }
    </script>
</body>
</html>
