
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Modo Tablet - Chamada Escolar</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; text-align: center;">

    <div style="max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);">
        <h2>Registro de Frequência (Tablet)</h2>
        <p style="color: #666; font-size: 14px;">Digite o CPF do aluno para registrar a presença:</p>
        
        <input type="text" id="tablet-cpf" placeholder="Digite o CPF do aluno" style="width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; font-size: 16px;"><br>
        
        <button onclick="registrarPresenca()" style="width: 100%; background: #ffc107; color: #333; padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Registrar Presença</button>
        
        <p id="tablet-msg" style="margin-top: 15px; font-weight: bold;"></p>
        
        <br>
        <a href="index.html" style="font-size: 13px; color: #007BFF; text-decoration: none;">← Voltar para a página inicial</a>
    </div>

    <script>
        function registrarPresenca() {
            const cpfDigitado = document.getElementById("tablet-cpf").value.trim();
            const cpfSalvo = localStorage.getItem("aluno_cpf");
            const nomeAluno = localStorage.getItem("aluno_nome") || "Aluno";
            const msg = document.getElementById("tablet-msg");

            if (!cpfDigitado) {
                msg.style.color = "red";
                msg.innerText = "Por favor, digite um CPF.";
                return;
            }

            if (cpfDigitado === cpfSalvo || cpfDigitado === "45870857821") {
                const dataHora = new Date().toLocaleString("pt-BR");
                
                // Salva histórico de frequência
                let historico = JSON.parse(localStorage.getItem("historico_frequencia")) || [];
                historico.push({ nome: nomeAluno, cpf: cpfDigitado, data: dataHora });
                localStorage.setItem("historico_frequencia", JSON.stringify(historico));

                msg.style.color = "green";
                msg.innerText = `Presença confirmada para ${nomeAluno} às ${dataHora}!`;
                document.getElementById("tablet-cpf").value = "";
            } else {
                msg.style.color = "red";
                msg.innerText = "CPF não encontrado no sistema.";
            }
        }
    </script>
</body>
</html>
