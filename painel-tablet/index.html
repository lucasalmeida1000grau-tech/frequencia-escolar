<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Tablet - Frequência Escolar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #eef2f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .tablet-container { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.15); width: 100%; max-width: 500px; text-align: center; }
    h1 { color: #333; margin-bottom: 10px; font-size: 26px; }
    p { color: #666; margin-bottom: 25px; font-size: 15px; }
    .input-group { margin-bottom: 20px; text-align: left; }
    label { display: block; margin-bottom: 8px; font-weight: bold; color: #444; font-size: 14px; }
    input { width: 100%; padding: 15px; border: 2px solid #ccc; border-radius: 8px; font-size: 18px; text-align: center; }
    input:focus { border-color: #007bff; outline: none; }
    button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
    button:hover { background-color: #218838; }
    #mensagem-status { margin-top: 20px; font-size: 18px; font-weight: bold; min-height: 30px; }
    .sucesso { color: #28a745; }
    .erro { color: #dc3545; }
    .voltar { display: block; margin-top: 20px; color: #007bff; text-decoration: none; font-size: 14px; }
  </style>
</head>
<body>

  <div class="tablet-container">
    <h1>📱 Registro de Frequência</h1>
    <p>Digite sua matrícula ou aproxime o cartão/código</p>

    <div class="input-group">
      <label>Código do Aluno / Matrícula</label>
      <input type="text" id="codigo-aluno" placeholder="Ex: 12345" autofocus>
    </div>

    <button onclick="registrarPresenca()">Confirmar Presença</button>

    <div id="mensagem-status"></div>

    <a href="../" class="voltar">← Voltar para a tela de Login</a>
  </div>

  <script>
    const API_URL = 'https://frequencia-escolar-online.onrender.com';

    async function registrarPresenca() {
      const codigo = document.getElementById('codigo-aluno').value.trim();
      const statusDiv = document.getElementById('mensagem-status');

      if (!codigo) {
        statusDiv.className = 'erro';
        statusDiv.innerText = 'Por favor, informe o código do aluno.';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/api/tablet/registrar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ codigoAluno: codigo })
        });

        const data = await response.json();

        if (response.ok) {
          statusDiv.className = 'sucesso';
          statusDiv.innerText = data.mensagem || 'Presença registrada com sucesso!';
          document.getElementById('codigo-aluno').value = ''; // Limpa o campo para o próximo
        } else {
          statusDiv.className = 'erro';
          statusDiv.innerText = data.mensagem || 'Erro ao registrar.';
        }
      } catch (err) {
        statusDiv.className = 'erro';
        statusDiv.innerText = 'Erro de conexão com o servidor.';
      }

      // Limpa a mensagem após 4 segundos
      setTimeout(() => {
        statusDiv.innerText = '';
      }, 4000);
    }

    // Permite enviar apertando "Enter" no teclado do tablet
    document.getElementById('codigo-aluno').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        registrarPresenca();
      }
    });
  </script>
</body>
</html>
