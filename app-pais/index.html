<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Responsável</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 400px; margin-left: auto; margin-right: auto; }
    h2 { font-size: 18px; margin-bottom: 15px; color: #007bff; }
    .input-group { margin-bottom: 12px; }
    label { display: block; margin-bottom: 5px; font-size: 14px; }
    input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .notificacao { border-left: 5px solid #007bff; padding: 15px; background: #e9f5ff; border-radius: 6px; margin-top: 10px; }
    .foto-aluno { width: 100%; max-width: 200px; border-radius: 8px; margin-top: 10px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Cadastrar Aluno</h2>
    <form id="form-aluno">
      <div class="input-group">
        <label>Nome Completo do Aluno</label>
        <input type="text" id="nome" required>
      </div>
      <div class="input-group">
        <label>CPF do Aluno (exatamente 11 números)</label>
        <input type="text" id="cpf" maxlength="11" minlength="11" required placeholder="12345678901">
      </div>
      <div class="input-group">
        <label>Código da Sala/Turma (fornecido pela escola)</label>
        <input type="text" id="codigoTurma" required placeholder="Ex: 7a2026">
      </div>
      <button type="submit">Salvar Aluno</button>
    </form>
  </div>

  <div class="card">
    <h2>Notificações da Escola</h2>
    <div id="avisos"><p style="color: #777;">Nenhum registro ainda.</p></div>
  </div>

  <script>
    const API_URL = 'https://frequencia-escolar-online.onrender.com';

    document.getElementById('form-aluno').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome').value;
      const cpf = document.getElementById('cpf').value;
      const codigoTurma = document.getElementById('codigoTurma').value;

      const response = await fetch(`${API_URL}/api/cadastrar-aluno`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, cpf, codigoTurma })
      });

      const data = await response.json();
      alert(data.mensagem);
      if (response.ok) {
        document.getElementById('form-aluno').reset();
        iniciarMonitoramento(cpf);
      }
    });

    function iniciarMonitoramento(cpf) {
      setInterval(async () => {
        const res = await fetch(`${API_URL}/api/presenca/${cpf}`);
        const data = await res.json();
        if (data.registros && data.registros.length > 0) {
          const avisosDiv = document.getElementById('avisos');
          avisosDiv.innerHTML = '';
          data.registros.forEach(r => {
            avisosDiv.innerHTML += `
              <div class="notificacao">
                <p><strong>Status:</strong> ${r.mensagem}</p>
                <p><strong>Horário:</strong> ${r.horario}</p>
                ${r.foto ? `<img src="${r.foto}" class="foto-aluno">` : ''}
              </div>
            `;
          });
        }
      }, 3000);
    }
  </script>
</body>
</html>
