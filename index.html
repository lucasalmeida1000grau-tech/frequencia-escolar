<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequência Escolar - Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .card { background: white; padding: 35px 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 420px; text-align: center; }
    h1 { color: #333; margin-bottom: 8px; font-size: 22px; }
    p { color: #666; margin-bottom: 25px; font-size: 13px; }
    .form-group { margin-bottom: 16px; text-align: left; }
    label { display: block; font-size: 12px; color: #555; margin-bottom: 6px; font-weight: bold; }
    input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    input:focus { border-color: #007bff; }
    .btn-submit { background-color: #28a745; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; width: 100%; cursor: pointer; margin-top: 5px; margin-bottom: 15px; }
    .btn-submit:hover { background-color: #218838; }
    .divider { border-top: 1px solid #eee; margin: 20px 0; position: relative; }
    .divider span { background: white; padding: 0 10px; color: #888; font-size: 12px; position: relative; top: -10px; }
    .btn-tablet { display: inline-block; background-color: #007bff; color: white; padding: 14px 20px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; width: 100%; box-shadow: 0 4px 10px rgba(0,123,255,0.2); }
    .btn-tablet:hover { background-color: #0056b3; }
    .row-links { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 15px; align-items: center; }
    .row-links a { color: #007bff; text-decoration: none; }
    .row-links a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="card">
    <h1>Frequência Escolar</h1>
    <p>Faça login para continuar</p>
    
    <form onsubmit="fazerLogin(event)">
      <div class="form-group">
        <label>E-mail ou Usuário</label>
        <input type="text" id="userInput" placeholder="Digite seu e-mail ou ADM1" required>
      </div>

      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="passInput" placeholder="Digite sua senha ou ADM2" required>
      </div>

      <div class="row-links">
        <label style="font-weight: normal; display: flex; align-items: center; gap: 4px; cursor: pointer;">
          <input type="checkbox" style="width: auto;"> Lembrar
        </label>
        <a href="cadastro.html">Criar conta</a>
      </div>

      <button type="submit" class="btn-submit">Entrar no Sistema</button>
    </form>

    <div class="divider">
      <span>OU</span>
    </div>
    
    <a href="tablet.html" class="btn-tablet">
      📱 Acessar Painel do Tablet
    </a>
  </div>

  <script>
    function fazerLogin(event) {
      event.preventDefault();
      const u = document.getElementById('userInput').value.trim();
      const p = document.getElementById('passInput').value.trim();

      // Verifica credenciais do Administrador
      if (u === 'ADM1' && p === 'ADM2') {
        window.location.href = 'painel-admin.html';
        return;
      }

      // Verifica contas cadastradas de responsáveis comuns
      let contas = JSON.parse(localStorage.getItem('listaContas') || '[]');
      const encontrada = contas.find(c => c.email === u && c.senha === p);

      if (encontrada || (u !== "" && p !== "")) {
        // Salva a sessão ativa para puxar na página do usuário
        const sessao = encontrada || { email: u, nome: "Aluno Exemplo", cpf: "000.000.000-00", turma: "1º Ano A" };
        localStorage.setItem('sessaoAtual', JSON.stringify(sessao));
        
        // Se a conta for marcada como admin por outro gestor, joga pro painel adm
        if (encontrada && encontrada.isAdmin) {
          window.location.href = 'painel-admin.html';
        } else {
          window.location.href = 'painel-usuario.html';
        }
      } else {
        alert('E-mail ou senha incorretos, ou conta não encontrada.');
      }
    }
  </script>

</body>
</html>
