<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Responsável - Frequência Escolar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    header { background-color: #007bff; color: white; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { font-size: 18px; margin-bottom: 15px; color: #007bff; }
    .input-group { margin-bottom: 12px; text-align: left; }
    label { display: block; margin-bottom: 5px; font-size: 14px; color: #555; }
    input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    button:hover { background-color: #218838; }
    .notificacao-card { border-left: 5px solid #007bff; padding: 15px; background: #e9f5ff; border-radius: 6px; margin-top: 10px; }
    .foto-aluno { width: 100%; max-width: 200px; border-radius: 8px; margin-top: 10px; display: block; }
    .btn-logout { background-color: #dc3545; margin-top: 20px; }
    .btn-logout:hover { background-color: #c82333; }
  </style>
</head>
<body>

  <header>
    <h1>Painel do Responsável</h1>
    <p>Acompanhamento e Cadastro de Alunos</p>
  </header>

  <!-- FORMULÁRIO DE CADASTRO DO ALUNO -->
  <div class="card">
    <h2>Cadastrar Aluno</h2>
    <form id="form-cadastro-aluno">
      <div class="input-group">
        <label>Nome Completo do Aluno</label>
        <input type="text" id="nome-aluno" required placeholder="Ex: João Silva">
      </div>

      <div class="input-group">
        <label>CPF do Aluno</label>
        <input type="text" id="cpf-aluno" required placeholder="000.000.000-00">
      </div>

      <div class="input-group">
        <label>Turma</label>
        <input type="text" id="turma-aluno" required placeholder="Ex: 9º Ano A">
      </div>

      <button type="submit">Salvar Aluno</button>
    </form>
  </div>

  <!-- SEÇÃO DE NOTIFICAÇÕES DE ENTRADA -->
  <div class="card">
    <h2>Avisos de Entrada / Registro</h2>
    <div id="painel-avisos">
      <p style="color: #777;">Nenhuma entrada registrada hoje ainda.</p>
    </div>
  </div>

  <button class="btn-logout" onclick="sair()">Sair da Conta</button>

  <script>
    const API_URL = 'https://frequencia-escolar-online.onrender.com';

    // Salvar Aluno no Banco de Dados
    document.getElementById('form-cadastro-aluno').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('nome-aluno').value;
      const cpf = document.getElementById('cpf-aluno').value;
      const turma = document.getElementById('turma-aluno').value;

      try {
        const response = await fetch(`${API_URL}/api/cadastrar-aluno`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nome, cpf, turma })
        });

        const data = await response.json();
        if (response.ok) {
          alert('Aluno cadastrado com sucesso!');
          document.getElementById('form-cadastro-aluno').reset();
        } else {
          alert('Erro: ' + (data.mensagem || 'Não foi possível cadastrar'));
        }
      } catch (err) {
        alert('Erro ao conectar com o servidor.');
      }
    });

    // Função para buscar notificações de presença enviadas pelo tablet da escola
    async function carregarNotificacoes() {
      const cpf = document.getElementById('cpf-aluno').value;
      if (!cpf) return;

      try {
        const response = await fetch(`${API_URL}/api/presenca/${cpf}`);
        const data = await response.json();

        if (response.ok && data.registros) {
          const painel = document.getElementById('painel-avisos');
          painel.innerHTML = '';

          data.registros.forEach(reg => {
            painel.innerHTML += `
              <div class="notificacao-card">
                <p><strong>Status:</strong> ${reg.mensagem}</p>
                <p><strong>Horário:</strong> ${reg.horario}</p>
                ${reg.foto ? `<img src="${reg.foto}" class="foto-aluno" alt="Foto do Aluno">` : ''}
              </div>
            `;
          });
        }
      } catch (err) {
        console.log('Aguardando registros...');
      }
    }

    function sair() {
      window.location.href = '../index.html';
    }
  </script>
</body>
</html>
