function registrarPresencaComFoto(cpfAluno) {
    const video = document.getElementById("video-camera"); // Certifique-se de ter a tag <video id="video-camera"> no seu HTML
    
    // Cria um espaço temporário (canvas) para tirar a "foto" do vídeo da câmera
    const canvas = document.createElement("canvas");
    canvas.width = 320;
    canvas.height = 240;
    const contexto = canvas.getContext("2d");
    contexto.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Converte a imagem capturada em uma URL de texto (Base64)
    const urlDaFoto = canvas.toDataURL("image/png");

    // Pega a data e a hora atual exata
    const agora = new Date();
    const dataFormatada = agora.toLocaleDateString('pt-BR');
    const horaFormatada = agora.toLocaleTimeString('pt-BR');

    const novoRegistro = {
        data: dataFormatada,
        hora: horaFormatada,
        foto: urlDaFoto
    };

    // Salva na memória do GitHub Pages vinculado ao CPF do aluno
    let historicoAluno = JSON.parse(localStorage.getItem("historico_" + cpfAluno)) || [];
    historicoAluno.unshift(novoRegistro); // Coloca o mais recente no topo
    localStorage.setItem("historico_" + cpfAluno, JSON.stringify(historicoAluno));

    alert("Presença registrada e foto enviada para o responsável!");
}
