<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Terminal de Frequência - Tablet</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #1e1e2f; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; color: #fff; }
    .card { background: #2b2b40; padding: 35px 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); width: 100%; max-width: 420px; text-align: center; }
    h2 { margin-bottom: 10px; font-size: 22px; color: #fff; }
    p { color: #aaa; margin-bottom: 25px; font-size: 13px; }
    input { width: 100%; padding: 14px; border: 1px solid #444; background: #1e1e2f; color: #fff; border-radius: 8px; font-size: 16px; text-align: center; margin-bottom: 20px; outline: none; }
    button { background-color: #007bff; color: white; padding: 14px; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; width: 100%; cursor: pointer; margin-top: 10px; }
    .hidden { display: none; }
    video { width: 100%; border-radius: 8px; margin-bottom: 15px; background: #000; }
    canvas { display: none; }
    .success-box { background: #28a745; color: white; padding: 15px; border-radius: 8px; margin-top: 15px; font-weight: bold; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card" id="tela-sala">
    <h2>Painel do Tablet</h2>
    <p>Digite o código da sala gerado pelo Admin.</p>
    <input type="text" id="codigoSalaInput" placeholder="EX: SALA123">
    <button onclick="validarSala()">Acessar</button>
  </div>

  <div class="card hidden" id="tela-cpf">
    <h2>Registro de Presença</h2>
    <p>Digite o CPF do aluno cadastrado</p>
    <input type="text" id="cpfAlunoInput" placeholder="000.000.000-00">
    <button onclick="verificarCPF()">Buscar Aluno</button>
  </div>

  <div class="card hidden" id="tela-camera">
    <h2>Capturar Foto</h2>
    <p id="alunoInfo">Posicione-se para a foto</p>
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    <button onclick="tirarFoto()">Tirar Foto e Enviar</button>
  </div>

  <div class="card hidden" id="tela-sucesso">
    <h2>Presença Registrada!</h2>
    <div class="success-box">Foto enviada e responsável notificado!</div>
    <button onclick="reiniciar()">Próximo Aluno</button>
  </div>

  <script>
    let streamCamera = null;
    let alunoAtual = null;

    function validarSala() {
      if (document.getElementById('codigoSalaInput').value.trim() !== "") {
        document.getElementById('tela-sala').classList.add('hidden');
        document.getElementById('tela-cpf').classList.remove('hidden');
      } else { alert('Digite o código.'); }
    }

    function verificarCPF() {
      const cpf = document.getElementById('cpfAlunoInput').value.trim();
      const contas = JSON.parse(localStorage.getItem('listaContas') || '[]');
      alunoAtual = contas.find(c => c.cpf === cpf);

      if (alunoAtual) {
        document.getElementById('alunoInfo').innerText = `Aluno: ${alunoAtual.nome}`;
        document.getElementById('tela-cpf').classList.add('hidden');
        document.getElementById('tela-camera').classList.remove('hidden');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }).then(s => {
          streamCamera = s;
          document.getElementById('video').srcObject = s;
        }).catch(() => alert('Erro na câmera.'));
      } else {
        alert('CPF não encontrado no sistema!');
      }
    }

    function tirarFoto() {
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video, 0, 0);

      if (streamCamera) streamCamera.getTracks().forEach(t => t.stop());

      const agora = new Date();
      const horario = agora.toLocaleTimeString('pt-BR', { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit' });
      const data = agora.toLocaleDateString('pt-BR');

      let regs = JSON.parse(localStorage.getItem('registrosPresenca') || '[]');
      regs.push({ nome: alunoAtual.nome, cpf: alunoAtual.cpf, turma: alunoAtual.turma, horario, data, status: 'Presente' });
      localStorage.setItem('registrosPresenca', JSON.stringify(regs));

      document.getElementById('tela-camera').classList.add('hidden');
      document.getElementById('tela-sucesso').classList.remove('hidden');
    }

    function reiniciar() {
      document.getElementById('cpfAlunoInput').value = '';
      document.getElementById('codigoSalaInput').value = '';
      document.getElementById('tela-sucesso').classList.add('hidden');
      document.getElementById('tela-sala').classList.remove('hidden');
    }
  </script>
</body>
</html>
