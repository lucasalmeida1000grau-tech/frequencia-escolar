<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel Administrador</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background: #f4f6f9; padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 20px; max-width: 800px; margin-left: auto; margin-right: auto; }
    h2 { color: #333; margin-bottom: 15px; }
    input, button { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
    button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #0056b3; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
    th { background-color: #f1f1f1; }
  </style>
</head>
<body>

  <!-- Tela de Login do ADM (Senha Oculta) -->
  <div class="card" id="login-adm-box">
    <h2>Login do Administrador</h2>
    <input type="text" id="adm-user" placeholder="Usuário (adm1)">
    <input type="password" id="adm-pass" placeholder="Senha (07adm01)">
    <button onclick="logarAdm()">Entrar no Painel ADM</button>
  </div>

  <!-- Painel Principal do ADM (Oculto até logar) -->
  <div id="painel-adm" style="display: none;">
    <div class="card">
      <h2>Gerenciar Salas / Turmas</h2>
      <input type="text" id="codigo-sala" placeholder="Código da Sala (Ex: 7a2026)">
      <input type="text" id="nome-turma" placeholder="Nome da Turma (Ex: 7º Ano A)">
      <button onclick="criarSala()">Criar Sala</button>
    </div>

    <div class="card">
      <h2>Salas Cadastradas</h2>
      <div id="lista-salas">Nenhuma sala cadastrada.</div>
    </div>

    <div class="card">
      <h2>Monitoramento em Tempo Real (Alunos, Atrasos e Presenças)</h2>
      <div id="relatorio-geral">Carregando dados...</div>
    </div>
  </div>

  <script>
    const API_URL = 'https://frequencia-escolar-online.onrender.com';

    async function logarAdm() {
      const usuario = document.getElementById('adm-user').value;
      const senha = document.getElementById('adm-pass').value;

      const res = await fetch(`${API_URL}/api/adm/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, senha })
      });

      if (res.ok) {
        document.getElementById('login-adm-box').style.display = 'none';
        document.getElementById('painel-adm').style.display = 'block';
        carregarDadosAdm();
        setInterval(carregarDadosAdm, 5000);
      } else {
        alert('Usuário ou senha do Administrador incorretos.');
      }
    }

    async function criarSala() {
      const codigo = document.getElementById('codigo-sala').value;
      const nomeTurma = document.getElementById('nome-turma').value;

      const res = await fetch(`${API_URL}/api/adm/criar-sala`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ codigo, nomeTurma })
      });

      const data = await res.json();
      alert(data.mensagem);
      if (res.ok) {
        document.getElementById('codigo-sala').value = '';
        document.getElementById('nome-turma').value = '';
        carregarDadosAdm();
      }
    }

    async function carregarDadosAdm() {
      const res = await fetch(`${API_URL}/api/adm/dados`);
      const data = await res.json();

      const divSalas = document.getElementById('lista-salas');
      if (data.salas.length === 0) {
        divSalas.innerHTML = 'Nenhuma sala cadastrada.';
      } else {
        divSalas.innerHTML = '<ul>' + data.salas.map(s => `<li>Código: <strong>${s.codigo}</strong> — Turma: ${s.nomeTurma}</li>`).join('') + '</ul>';
      }

      const divRelatorio = document.getElementById('relatorio-geral');
      if (data.registros.length === 0) {
        divRelatorio.innerHTML = 'Nenhum registro de ponto até o momento.';
      } else {
        let tabela = `<table><tr><th>Aluno</th><th>Turma</th><th>Horário</th><th>Status</th></tr>`;
        data.registros.forEach(r => {
          tabela += `<tr><td>${r.nomeAluno}</td><td>${r.turma || '-'}</td><td>${r.horario}</td><td>${r.mensagem}</td></tr>`;
        });
        tabela += `</table>`;
        divRelatorio.innerHTML = tabela;
      }
    }
  </script>
</body>
</html>
